<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: assigned.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#181818}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-sidebar-brand region chrome" data-region="sidebar-brand"><!-- VASA wordmark and Agentic Software Factory tagline --></div>
  <div class="r-sidebar-switcher region control" data-region="sidebar-switcher"><!-- Working on label and View all project switcher: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-switcher); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sidebar-nav region chrome" data-region="sidebar-nav"><!-- Work and Build nav groups --></div>
  <div class="r-sidebar-settings region control" data-region="sidebar-settings"><!-- Settings nav item current, collapse control below it: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-settings); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-title region text" data-region="title"><!-- Settings heading --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-purpose region text" data-region="purpose"><!-- Whether this Factory can run a Job. --><p style="font-size:var(--r-purpose-font);line-height:1.05;margin:0">purpose</p></div>
  <div class="r-readout-github region control" data-region="readout-github"><!-- GitHub @mitchell connected status: rebuild the control's chrome from the crop (comp-spec.mjs --crop readout-github); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-readout-machine region control" data-region="readout-machine"><!-- This machine online status: rebuild the control's chrome from the crop (comp-spec.mjs --crop readout-machine); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-readout-projects region control" data-region="readout-projects"><!-- Projects 3 ready status: rebuild the control's chrome from the crop (comp-spec.mjs --crop readout-projects); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-machine-label region text" data-region="machine-label"><!-- This machine section label --><p style="font-size:var(--r-machine-label-font);line-height:1.05;margin:0">machine-label</p></div>
  <div class="r-machine-row region control" data-region="machine-row"><!-- Factory-MBP online row with Lock: rebuild the control's chrome from the crop (comp-spec.mjs --crop machine-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-github-label region text" data-region="github-label"><!-- GitHub section label --><p style="font-size:var(--r-github-label-font);line-height:1.05;margin:0">github-label</p></div>
  <div class="r-github-row region control" data-region="github-row"><!-- @mitchell connected row with Disconnect: rebuild the control's chrome from the crop (comp-spec.mjs --crop github-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-projects-label region text" data-region="projects-label"><!-- Projects section label --><p style="font-size:var(--r-projects-label-font);line-height:1.05;margin:0">projects-label</p></div>
  <div class="r-project-factory region control" data-region="project-factory"><!-- Factory project row with Edit and Remove: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-factory); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-project-ios region control" data-region="project-ios"><!-- ios-app project row with Edit and Remove: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-ios); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-project-web region control" data-region="project-web"><!-- web project row with Edit and Remove: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-web); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-add-project region control" data-region="add-project"><!-- Add Project button: rebuild the control's chrome from the crop (comp-spec.mjs --crop add-project); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-providers-label region text" data-region="providers-label"><!-- Providers section label --><p style="line-height:1.05;margin:0">providers-label</p></div>
  <div class="r-provider-cursor region control" data-region="provider-cursor"><!-- Cursor row, key saved, password field: rebuild the control's chrome from the crop (comp-spec.mjs --crop provider-cursor); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-provider-codex region control" data-region="provider-codex"><!-- Codex row, CLI login, password field: rebuild the control's chrome from the crop (comp-spec.mjs --crop provider-codex); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-provider-grok region control" data-region="provider-grok"><!-- Grok Build row, CLI login, password field: rebuild the control's chrome from the crop (comp-spec.mjs --crop provider-grok); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-appearance-label region text" data-region="appearance-label"><!-- Appearance section label --><p style="font-size:var(--r-appearance-label-font);line-height:1.05;margin:0">appearance-label</p></div>
  <div class="r-appearance-row region control" data-region="appearance-row"><!-- Color mode Dark Light segmented control: rebuild the control's chrome from the crop (comp-spec.mjs --crop appearance-row); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
