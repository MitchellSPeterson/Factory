name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  desktop:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash desktop/build.sh --release
      - run: gh release create "$GITHUB_REF_NAME" desktop/FactoryMenu-macos-*.zip --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
